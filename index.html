<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Music</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    color:white;
    background:#111;
}

.page{
    min-height:100vh;
    padding:40px 15px;
    background:
        linear-gradient(rgba(60,0,0,.6),rgba(0,0,0,.85)),
        url("background.jpg");
    background-size:cover;
    background-position:center;
}

.container{
    max-width:800px;
    margin:auto;
}

h1{
    text-align:center;
    font-size:60px;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#ddd;
    margin-bottom:35px;
}

.player{
    background:rgba(120,30,20,.85);
    padding:20px;
    border-radius:20px;
    margin-bottom:25px;
    text-align:center;
}

#nowPlaying{
    margin-bottom:15px;
    font-size:18px;
}

audio{
    width:100%;
}

.playlist{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.song{
    background:rgba(255,255,255,.12);
    padding:12px 15px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.song.active{
    background:rgba(180,60,40,.9);
}

.song button{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

@media(max-width:600px){
    h1{
        font-size:45px;
    }
}
</style>
</head>

<body>

<div class="page">
<div class="container">

<h1>मेरा म्यूजिक</h1>

<p class="subtitle">मेरे गाने 🎵</p>

<div class="player">

<div id="nowPlaying">
गाना चुनें
</div>

<audio id="audio" controls></audio>

</div>

<div class="playlist">

<div class="song" onclick="playSong(1,this)">
<span>🎵 Song 1</span>
<button>▶</button>
</div>

<div class="song" onclick="playSong(2,this)">
<span>🎵 Song 2</span>
<button>▶</button>
</div>

<div class="song" onclick="playSong(3,this)">
<span>🎵 Song 3</span>
<button>▶</button>
</div>

<div class="song" onclick="playSong(4,this)">
<span>🎵 Song 4</span>
<button>▶</button>
</div>

<div class="song" onclick="playSong(5,this)">
<span>🎵 Song 5</span>
<button>▶</button>
</div>

<div class="song" onclick="playSong(6,this)">
<span>🎵 Song 6</span>
<button>▶</button>
</div>

<div class="song" onclick="playSong(7,this)">
<span>🎵 Song 7</span>
<button>▶</button>
</div>

<div class="song" onclick="playSong(8,this)">
<span>🎵 Song 8</span>
<button>▶</button>
</div>

<div class="song" onclick="playSong(9,this)">
<span>🎵 Song 9</span>
<button>▶</button>
</div>

</div>

</div>
</div>

<script>

const audio = document.getElementById("audio");
const nowPlaying = document.getElementById("nowPlaying");

function playSong(number, element){

    audio.src = "song (" + number + ").mp3";

    nowPlaying.innerText = "अब चल रहा है: Song " + number;

    document.querySelectorAll(".song").forEach(song => {
        song.classList.remove("active");
    });

    element.classList.add("active");

    audio.play();
}

</script>

</body>
</html>
